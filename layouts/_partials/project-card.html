{{- $title := .Title }}
{{- $source := .Params.source }}
{{- if $source }}
<a class="project-card" href="{{ $source }}" target="_blank" rel="noopener noreferrer">
{{- else }}
<article class="project-card">
{{- end }}
    {{- with .Params.image }}
    <img class="project-cover" src="{{ . | relURL }}" alt="">
    {{- end }}
    <div class="project-body">
        <h2>{{ $title }}</h2>
        <p>{{ .Description }}</p>
        {{- with .Params.tags }}
        <div class="project-tags">
            {{- range . }}
            <span>{{ . }}</span>
            {{- end }}
        </div>
        {{- end }}
    </div>
{{- if $source }}
</a>
{{- else }}
</article>
{{- end }}
